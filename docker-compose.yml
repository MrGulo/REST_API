services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://admin:adminpassword@db:5432/task_db?sslmode=disable
      - up

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://admin:adminpassword@db:5432/task_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super_secret_key}
      SERVER_PORT: ${SERVER_PORT:-:8080}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: